# Temporary, for #9: times the editor's JS compile on ubuntu-24.04 to compare with the macOS build. Removed before merge.
name: measure-ubuntu-compile

on:
  pull_request:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Install the system packages that native modules need
        run: |
          nproc
          free -g
          df -h .
          sudo apt-get update -q
          sudo apt-get install -y -q pkg-config libxkbfile-dev libkrb5-dev

      - name: Prepare the tree
        run: scripts/editor/prepare

      - name: npm ci
        working-directory: editor/vscode
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/time -v npm ci --no-audit --no-fund 2>&1 | tail -30

      - name: Download the built-in extensions
        working-directory: editor/vscode
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run download-builtin-extensions

      # The same compile steps as vscode-darwin-<arch>-min before its packaging step, which needs macOS.
      - name: Compile for packaging
        working-directory: editor/vscode
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: /usr/bin/time -v npm run gulp vscode-darwin-x64-min 2>&1 | grep -E "Starting|Finished|errored|Error|Maximum resident|Elapsed" | grep -v "typechecking extension\|Bundled extension\|esbuilding extension"

      - name: Size of the compile output
        working-directory: editor/vscode
        run: du -sh out-vscode-min out-build .build/extensions 2>/dev/null || true
