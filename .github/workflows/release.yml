name: Release

# Release PRs only: head develop, base main. While the PR is open, dry-run builds, packages, and audits the
# cask and publishes nothing. When Ryan merges it, publish tags the merge commit, creates the GitHub Release,
# and pushes Casks/wisp.rb to the ryan-stoffel/taps tap. The version lives only in the tag, so nothing is
# ever pushed to main.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, closed]

permissions: {}

defaults:
  run:
    shell: bash

env:
  # Add x64 to ship an Intel build as well; generate-cask and the cask template handle both.
  RELEASE_ARCHES: arm64

jobs:
  dry-run:
    if: >-
      github.event.action != 'closed'
      && github.head_ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: read
    concurrency:
      group: ${{ github.workflow }}-dry-run-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ci/fixtures/electron-smoke/package-lock.json

      - name: Test the release scripts
        run: scripts/ci/check-release

      - name: Compute the version this merge would release
        run: |
          version=$(scripts/ci/next-version)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Build and package wisp.app
        run: |
          for arch in $RELEASE_ARCHES; do
            scripts/ci/package-app "$VERSION" "$arch"
          done

      - name: Generate the cask
        run: scripts/ci/generate-cask "$VERSION" dist/wisp-"$VERSION"-*.zip > dist/wisp.rb

      - name: Style, audit, and install the cask in a throwaway tap
        run: scripts/ci/audit-cask dist/wisp.rb dist/wisp-"$VERSION"-*.zip

      - name: Summarize
        run: |
          {
            echo "## Release dry run: wisp $VERSION"
            echo
            echo "Nothing was published. Merging this PR tags \`v$VERSION\`, creates the GitHub Release, and pushes \`Casks/wisp.rb\` to ryan-stoffel/homebrew-taps."
            echo
            echo '```'
            (cd dist && shasum -a 256 wisp-*.zip)
            echo '```'
            echo
            echo '```ruby'
            cat dist/wisp.rb
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wisp-${{ env.VERSION }}-dry-run
          path: |
            dist/wisp-*.zip
            dist/wisp.rb
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

  publish:
    if: >-
      github.event.action == 'closed'
      && github.event.pull_request.merged == true
      && github.head_ref == 'develop'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    # Queue releases instead of running two at once; never cancel one that has started.
    concurrency:
      group: ${{ github.workflow }}-publish
      cancel-in-progress: false
    # TAP_GITHUB_TOKEN can write to the tap, so only the steps that talk to the tap get it, not the build.
    env:
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - name: Require TAP_GITHUB_TOKEN before anything is tagged
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          if [ -z "$TAP_GITHUB_TOKEN" ]; then
            echo "::error title=TAP_GITHUB_TOKEN is missing::The cask cannot be pushed to ryan-stoffel/homebrew-taps without it, so nothing was tagged or released. Create the secret as described in ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/issues/28, then re-run this job."
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ci/fixtures/electron-smoke/package-lock.json

      - name: Check that TAP_GITHUB_TOKEN can reach the tap
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/ci/publish-cask --check

      - name: Test the release scripts
        run: scripts/ci/check-release

      - name: Compute the version
        run: |
          version=$(scripts/ci/next-version)
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Refuse a tag that already points elsewhere
        run: |
          if tagged=$(git rev-parse -q --verify "refs/tags/v$VERSION^{commit}"); then
            if [ "$tagged" != "$MERGE_SHA" ]; then
              echo "::error::v$VERSION already exists on $tagged, not on the merge commit $MERGE_SHA."
              exit 1
            fi
          fi

      - name: Reuse the published zips if this is a re-run
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v$VERSION" --repo "$GITHUB_REPOSITORY" --json tagName > /dev/null 2>&1; then
            mkdir -p dist
            gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern "wisp-$VERSION-*.zip" --dir dist
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and package wisp.app
        if: steps.existing.outputs.released != 'true'
        run: |
          for arch in $RELEASE_ARCHES; do
            scripts/ci/package-app "$VERSION" "$arch"
          done

      - name: Generate the cask
        run: scripts/ci/generate-cask "$VERSION" dist/wisp-"$VERSION"-*.zip > dist/wisp.rb

      - name: Style, audit, and install the cask in a throwaway tap
        run: scripts/ci/audit-cask dist/wisp.rb dist/wisp-"$VERSION"-*.zip

      - name: Tag the merge commit and create the GitHub Release
        if: steps.existing.outputs.released != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VERSION" dist/wisp-"$VERSION"-*.zip \
            --repo "$GITHUB_REPOSITORY" --target "$MERGE_SHA" \
            --title "wisp $VERSION" --generate-notes

      - name: Push the cask to ryan-stoffel/homebrew-taps
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: scripts/ci/publish-cask dist/wisp.rb "$VERSION"

      - name: Summarize
        run: |
          {
            echo "## Released wisp $VERSION"
            echo
            echo "- Release: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/releases/tag/v$VERSION"
            echo "- Cask: https://github.com/ryan-stoffel/homebrew-taps/blob/main/Casks/wisp.rb"
            echo "- Install: \`brew install --cask ryan-stoffel/taps/wisp\`"
          } >> "$GITHUB_STEP_SUMMARY"
