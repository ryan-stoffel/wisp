name: screenshots

# Captures only what a pull request asks for, and only with the screenshots label (0018): the
# wisp-media block in its body names the scenes, and publish writes them into that body.
on:
  pull_request:
    types: [labeled, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of an open pull request that has the screenshots label
        required: true
        type: number

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Decides whether to capture and what. Reads the pull request with a read-only token and runs the
  # head's request parser, so its outputs are as untrusted as the capture artifact.
  request:
    name: request
    # An unlabeled pull request stops here, before a runner starts.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (contains(github.event.pull_request.labels.*.name, 'screenshots') &&
      (github.event.action != 'labeled' || github.event.label.name == 'screenshots'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      number: ${{ steps.pull.outputs.number }}
      head-sha: ${{ steps.pull.outputs.head-sha }}
      run: ${{ steps.resolve.outputs.run }}
      publish: ${{ steps.resolve.outputs.publish }}
      problem: ${{ steps.resolve.outputs.problem }}
      request: ${{ steps.resolve.outputs.request }}
      base-sha: ${{ steps.resolve.outputs.base-sha }}
    steps:
      - name: Read the pull request
        id: pull
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || inputs.pr }}
        run: |
          if ! [[ $PR =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Screenshots::pr must be a pull request number, got '$PR'"
            exit 1
          fi
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR" > "$RUNNER_TEMP/pull.json"
          sha=$(jq -r .head.sha "$RUNNER_TEMP/pull.json")
          if ! [[ $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error title=Screenshots::pull request $PR has no head commit"
            exit 1
          fi
          echo "number=$PR" >> "$GITHUB_OUTPUT"
          echo "head-sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Check out the request parser and the scenes
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pull.outputs.head-sha }}
          persist-credentials: false
          sparse-checkout: ci/screenshots

      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ci/screenshots/package-lock.json

      - name: Decide what to capture
        id: resolve
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: ci/screenshots
        run: |
          npm ci --omit=dev --no-audit --no-fund
          node src/resolve.ts "$RUNNER_TEMP/pull.json"

      - name: Fail on a request that cannot run
        if: steps.resolve.outputs.problem != ''
        timeout-minutes: 1
        env:
          PROBLEM: ${{ steps.resolve.outputs.problem }}
        run: |
          echo "::error title=Screenshots request::$PROBLEM"
          exit 1

  capture:
    name: capture
    needs: request
    if: needs.request.outputs.run == 'true'
    runs-on: macos-26
    timeout-minutes: 150
    # Per job, not per workflow: a run the request job skips, such as an edit to the description's
    # text, must not cancel a capture in progress.
    concurrency:
      group: screenshots-capture-${{ needs.request.outputs.number }}
      cancel-in-progress: true
    permissions:
      contents: read
    env:
      ZIP: dist/editor/wisp-darwin-arm64.zip
      HEAD_SHA: ${{ needs.request.outputs.head-sha }}
      BASE_SHA: ${{ needs.request.outputs.base-sha }}
      REQUEST: ${{ needs.request.outputs.request }}
    outputs:
      build: ${{ steps.build.outcome }}
      base-build: ${{ steps.base-build.outcome }}
      capture: ${{ steps.capture.outcome }}
    steps:
      - name: Check out the head commit
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          persist-credentials: false

      # before-after shows the scene on the commit this pull request branched from, too.
      - name: Check out the base commit
        if: env.BASE_SHA != ''
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: .wisp-base
          persist-credentials: false

      # The base's own app-cache-key, so the key is the one ci.yml saved when it built that commit.
      - name: Hash the inputs of the base commit's app build
        id: base-inputs
        if: env.BASE_SHA != ''
        continue-on-error: true
        timeout-minutes: 2
        working-directory: .wisp-base
        run: |
          key=$(scripts/ci/app-cache-key arm64)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # The cache entry's path is part of its version, so the base zip restores to the same path as
      # the head's, before the head's, and moves aside.
      - name: Restore the base commit's app that ci.yml built
        id: base-cached
        if: env.BASE_SHA != '' && steps.base-inputs.outputs.key != ''
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIP }}
          key: ${{ steps.base-inputs.outputs.key }}

      - name: Set the base commit's app aside
        if: steps.base-cached.outputs.cache-hit == 'true'
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/base"
          mv "$ZIP" "$RUNNER_TEMP/base/app.zip"

      # The same key as ci.yml's app (arm64) job, so a push that changes no fork input reuses its build.
      # The cache only saves time, so without a key the job builds the app instead.
      - name: Hash the inputs of the app build
        id: inputs
        continue-on-error: true
        timeout-minutes: 2
        run: |
          key=$(scripts/ci/app-cache-key arm64)
          echo "key=$key" >> "$GITHUB_OUTPUT"

      # Restore only: ci.yml's app job is the one writer of this cache, and it saves only builds that pass check-app.
      - name: Restore the app that ci.yml built from the same inputs
        id: cached
        if: steps.inputs.outputs.key != ''
        timeout-minutes: 10
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ZIP }}
          key: ${{ steps.inputs.outputs.key }}

      - name: Set up Node
        timeout-minutes: 10
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: ${{ (steps.cached.outputs.cache-hit != 'true' || (env.BASE_SHA != '' && steps.base-cached.outputs.cache-hit != 'true')) && 'npm' || '' }}
          # Upstream's lockfiles exist only after scripts/editor/prepare runs, and the pin decides them.
          cache-dependency-path: editor/upstream.json

      # build-app also builds wispd (#62), only needed on a miss. The key matches ci.yml's rust
      # and app jobs, so all three can share one cached toolchain download.
      - name: Cache Rust toolchain
        if: steps.cached.outputs.cache-hit != 'true' || (env.BASE_SHA != '' && steps.base-cached.outputs.cache-hit != 'true')
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.rustup/toolchains/*
            !~/.rustup/toolchains/stable-*
          key: rustup-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust-toolchain.toml') }}

      # On a miss, upstream's build calls GitHub's API, which rate-limits anonymous calls from shared runners.
      # The token is this job's contents: read token, and it expires when the job ends, before publish reads the log.
      - name: Build the app, or unpack the cached build
        id: build
        timeout-minutes: 60
        env:
          CACHED: ${{ steps.cached.outputs.cache-hit }}
          KEY: ${{ steps.inputs.outputs.key }}
          GITHUB_TOKEN: ${{ steps.cached.outputs.cache-hit != 'true' && github.token || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/capture/logs" "$RUNNER_TEMP/app"
          log=$RUNNER_TEMP/capture/logs/build.log
          if [ "$CACHED" = true ]; then
            echo "Unpacking the app that ci.yml's app job built from the same inputs ($KEY)" | tee "$log"
            ditto -x -k "$ZIP" "$RUNNER_TEMP/app" 2>&1 | tee -a "$log"
            bundle=$RUNNER_TEMP/app/Wisp.app
            echo "- App: restored from ci.yml's cache, key \`$KEY\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No cached build of these inputs (${KEY:-no key}); building the app" | tee "$log"
            rustup toolchain install --no-self-update 2>&1 | tee -a "$log"
            scripts/ci/build-app arm64 2>&1 > "$RUNNER_TEMP/app-path" | tee -a "$log"
            bundle=$(cat "$RUNNER_TEMP/app-path")
            echo "- App: built here, because ci.yml's cache had no build for key \`${KEY:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "WISP_APP_BUNDLE=$bundle" >> "$GITHUB_ENV"

      # A failed base build fails only the before side of each before-after scene.
      - name: Build the base commit's app, or unpack the cached build
        id: base-build
        if: env.BASE_SHA != ''
        continue-on-error: true
        timeout-minutes: 60
        env:
          CACHED: ${{ steps.base-cached.outputs.cache-hit }}
          KEY: ${{ steps.base-inputs.outputs.key }}
          GITHUB_TOKEN: ${{ steps.base-cached.outputs.cache-hit != 'true' && github.token || '' }}
        run: |
          mkdir -p "$RUNNER_TEMP/capture/logs" "$RUNNER_TEMP/base-app"
          log=$RUNNER_TEMP/capture/logs/base-build.log
          if [ "$CACHED" = true ]; then
            echo "Unpacking the base commit's app that ci.yml built ($KEY)" | tee "$log"
            ditto -x -k "$RUNNER_TEMP/base/app.zip" "$RUNNER_TEMP/base-app" 2>&1 | tee -a "$log"
            bundle=$RUNNER_TEMP/base-app/Wisp.app
            echo "- Base app (\`$BASE_SHA\`): restored from ci.yml's cache, key \`$KEY\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No cached build of the base commit's inputs (${KEY:-no key}); building it" | tee "$log"
            cd .wisp-base
            rustup toolchain install --no-self-update 2>&1 | tee -a "$log"
            scripts/ci/build-app arm64 2>&1 > "$RUNNER_TEMP/base-app-path" | tee -a "$log"
            bundle=$(cat "$RUNNER_TEMP/base-app-path")
            echo "- Base app (\`$BASE_SHA\`): built here, because ci.yml's cache had no build for key \`${KEY:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "WISP_BASE_APP_BUNDLE=$bundle" >> "$GITHUB_ENV"

      # The runner image has no ffmpeg, and Playwright's own build only writes WebM, so the GIF previews need Homebrew's.
      - name: Install ffmpeg for the video previews
        if: contains(env.REQUEST, 'video:')
        continue-on-error: true
        timeout-minutes: 15
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
          HOMEBREW_NO_INSTALL_CLEANUP: '1'
          HOMEBREW_NO_ANALYTICS: '1'
        run: brew install ffmpeg

      - name: Capture the requested scenes
        id: capture
        timeout-minutes: 30
        run: scripts/ci/screenshots "$RUNNER_TEMP/capture/screenshots" --request "$REQUEST" 2>&1 | tee "$RUNNER_TEMP/capture/logs/capture.log"

      - name: Upload the captures
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/capture
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # The only job with a write token. Keep npm install, builds, and PR code that is not publish-screenshots
  # out of it, and treat the artifact and the request job's outputs as untrusted input (scripts/ci/README.md, Screenshots).
  publish:
    name: publish
    needs: [request, capture]
    if: ${{ !cancelled() && needs.request.outputs.publish == 'true' && needs.capture.result != 'cancelled' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: screenshots-publish-${{ needs.request.outputs.number }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the publish script
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.request.outputs.head-sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            ci/screenshots/src

      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the captures
        if: needs.capture.result != 'skipped'
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/capture

      - name: Write the Screenshots section of the pull request body
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.request.outputs.number }}
          HEAD_SHA: ${{ needs.request.outputs.head-sha }}
          BASE_SHA: ${{ needs.request.outputs.base-sha }}
          REQUEST_PROBLEM: ${{ needs.request.outputs.problem }}
          BUILD_OUTCOME: ${{ needs.capture.outputs.build }}
          BASE_BUILD_OUTCOME: ${{ needs.capture.outputs.base-build }}
          CAPTURE_OUTCOME: ${{ needs.capture.outputs.capture }}
        run: scripts/ci/publish-screenshots "$RUNNER_TEMP/capture/screenshots" --logs "$RUNNER_TEMP/capture/logs"
