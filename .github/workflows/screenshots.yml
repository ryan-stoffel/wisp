name: screenshots

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions: {}

concurrency:
  group: screenshots-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  capture:
    name: capture
    runs-on: macos-26
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      same-repo: ${{ steps.source.outputs.same-repo }}
      build: ${{ steps.build.outcome }}
      capture: ${{ steps.capture.outcome }}
    steps:
      - name: Skip pull requests from forks
        id: source
        timeout-minutes: 1
        env:
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [ "$HEAD_REPO" = "$GITHUB_REPOSITORY" ]; then
            echo "same-repo=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Screenshots skipped::The head branch is in ${HEAD_REPO:-a deleted fork}, not $GITHUB_REPOSITORY. Pull requests from forks get a read-only GITHUB_TOKEN, so this workflow cannot push to ci-screenshots or comment on the pull request."
          fi

      - name: Check out the head commit
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Node
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: '**/package-lock.json'

      - name: Cache the Electron download
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 5
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-${{ runner.arch }}-

      - name: Build the app
        id: build
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 100
        run: |
          mkdir -p "$RUNNER_TEMP/capture/logs"
          scripts/ci/build-app 2>&1 | tee "$RUNNER_TEMP/capture/logs/build.log"

      - name: Capture the scenarios
        id: capture
        if: steps.source.outputs.same-repo == 'true'
        timeout-minutes: 20
        run: scripts/ci/screenshots "$RUNNER_TEMP/capture/screenshots" 2>&1 | tee "$RUNNER_TEMP/capture/logs/capture.log"

      - name: Upload the captures
        if: ${{ !cancelled() && steps.source.outputs.same-repo == 'true' }}
        timeout-minutes: 5
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/capture
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  # The only job with a write token. Keep npm install, builds, and PR code that is not publish-screenshots
  # out of it, and treat the artifact as untrusted input (scripts/ci/README.md, Screenshots).
  publish:
    name: publish
    needs: capture
    if: ${{ !cancelled() && needs.capture.outputs.same-repo == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out the publish script
        timeout-minutes: 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
          sparse-checkout: |
            scripts/ci
            ci/screenshots/src

      - name: Set up Node
        timeout-minutes: 5
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Download the captures
        continue-on-error: true
        timeout-minutes: 5
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: screenshots
          path: ${{ runner.temp }}/capture

      - name: Publish the screenshots
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BUILD_OUTCOME: ${{ needs.capture.outputs.build }}
          CAPTURE_OUTCOME: ${{ needs.capture.outputs.capture }}
        run: scripts/ci/publish-screenshots "$RUNNER_TEMP/capture/screenshots" --logs "$RUNNER_TEMP/capture/logs"
