[workspace]
members = ["daemon", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/ryan-stoffel/wisp"
publish = false

[workspace.dependencies]
bytes = "1.12"
futures-util = { version = "0.3.34", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
serde = "1.0.229"
serde_json = "1.0.151"
tokio = "1.53"
tokio-util = "0.7.19"
ts-rs = "12.0.1"
uuid = "1.26"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
