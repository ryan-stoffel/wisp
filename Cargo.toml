[workspace]
members = ["daemon", "crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/ryan-stoffel/wisp"
publish = false

[workspace.dependencies]
bytes = "1.12"
clap = "4.6.7"
futures-util = { version = "0.3.34", default-features = false }
jiff = { version = "0.2.37", default-features = false, features = ["std"] }
nix = { version = "0.31.3", default-features = false }
notify = { version = "8.2.0", default-features = false, features = ["macos_fsevent"] }
rustix = "1.1.5"
security-framework = "3.7.0"
serde = "1.0.229"
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3"
thiserror = "2"
tokio = "1.53"
tokio-util = "0.7.19"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", default-features = false }
ts-rs = "12.0.1"
uuid = "1.26"
zeroize = "1.9.0"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
dbg_macro = "warn"
